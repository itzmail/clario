[package]
name = "clario"
version = "0.1.5"
edition = "2021"
authors = ["Ismail Nur Alam <ismailnuralam@gmail.com>"]
description = "Fast CLI for cleaning dev caches and build artifacts"
license = "MIT"

[dependencies]
tokio = { version = "1.49.0", features = [
  "rt-multi-thread",
  "macros",
  "fs",
  "io-std",
  "time",
] }
walkdir = "2.5.0"
serde = { version = "1.0.228", features = ["derive"] }
dirs = "6.0.0"

# Serialization formats
anyhow = "1.0.100"
chrono = { version = "0.4.43", features = ["serde"] }
zip = "8.1.0"
serde_json = "1.0.149"
trash = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
flate2 = "1.0"
tar = "0.4"
clap = { version = "4", features = ["derive"] }
colored = "2"
dialoguer = "0.11"
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
tokio-test = "0.4.5"
